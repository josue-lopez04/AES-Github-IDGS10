name: Node.js CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 18.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Lint (generate reports)
        run: |
          mkdir -p reports
          npx eslint . -f stylish -o reports/eslint-ci.txt || true
          npx eslint . -f json     -o reports/eslint-ci.json || true

      - name: Upload ESLint report
        uses: actions/upload-artifact@v4
        with:
          name: eslint-report-${{ matrix.node-version }}
          path: reports/
          if-no-files-found: error
          retention-days: 7

      - name: Fail if ESLint errors > 0
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'reports/eslint-ci.json';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          const errors = Array.isArray(data)
            ? data.reduce((sum, file) => sum + (file.errorCount || 0), 0)
            : (data.errorCount || 0);
          if (errors > 0) {
            console.error(errors + ' ESLint error(s)');
            process.exit(1);
          } else {
            console.log('ESLint OK');
          }
          NODE

      - name: Run Jest tests
        run: npm test
